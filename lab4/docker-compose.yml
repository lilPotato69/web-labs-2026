services:
  web:
    image: nginx:1.27-alpine
    container_name: lab4_nginx
    ports:
      - "8083:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: .
    container_name: lab4_php
    volumes:
      - ./www:/var/www/html
    expose:
      - "9000"