version: '3.8'

services:
  web:
    image: nginx:1.27-alpine
    container_name: lab8_nginx
    ports:
      - "8088:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: .
    container_name: lab8_php
    volumes:
      - ./www:/var/www/html
    expose:
      - "9000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: lab8_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lab8_db
      MYSQL_USER: lab8_user
      MYSQL_PASSWORD: lab8_pass
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    container_name: lab8_adminer
    ports:
      - "8089:8080"
    depends_on:
      - db

volumes:
  db_data: