<form id="excursionForm" action="process.php" method="POST">
    <div class="form-group">
        <label for="username">Ваше имя:</label>
        <input type="text" id="username" name="username" required>
    </div>
    <div class="form-group">
        <label for="date">Дата экскурсии:</label>
        <input type="date" id="date" name="date" required>
    </div>
    <div class="form-group">
        <label for="route">Маршрут:</label>
        <select id="route" name="route">
            <option value="city">Городской</option>
            <option value="historical">Исторический</option>
            <option value="nature">Природный</option>
        </select>
    </div>
    <div class="form-group checkbox-group">
        <input type="checkbox" id="audioguide" name="audioguide">
        <label for="audioguide">Нужен аудиогид</label>
    </div>
    <div class="form-group radio-group">
        <p>Язык экскурсии:</p>
        <label><input type="radio" name="language" value="ru" checked> Русский</label>
        <label><input type="radio" name="language" value="en"> English</label>
    </div>
    <button type="submit" class="btn">Записаться</button>
</form>
